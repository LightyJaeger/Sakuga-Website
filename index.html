const ROUND_NAMES = { 2: "Finale", 4: "Halbfinale", 8: "Viertelfinale", 16: "Achtelfinale", 32: "Sechzehntelfinale" };
const roundName = n => ROUND_NAMES[n] || `Runde der ${n}`;
// Turnier mit beliebig vielen Songs: Das Feld wird auf die nächste Zweierpotenz aufgefüllt, die Lücken sind Freilose (null).
let tour = store.get("sakuga.tournament", null);
if (tour && !tour.rounds?.[0]?.every(id => id === null || tour.themes[id])) tour = null;
const entrantsOf = () => tour.count || tour.size;
const isBye = (r, m) => r === 0 && (tour.rounds[0][m * 2] === null || tour.rounds[0][m * 2 + 1] === null);
/** Wie viele echte Duelle (ohne Freilose) schon entschieden sind. */
function playedDuels() {
  const decided = tour.rounds.slice(1).reduce((s, r) => s + r.length, 0);
  let byes = 0;
  for (let m = 0; m < (tour.rounds[1]?.length || 0); m++) if (isBye(0, m)) byes++;
  return decided - byes;
}
/** Zum nächsten Duell; Freilose werden dabei automatisch durchgewunken. */
function advance(winner) {
  const ids = tour.rounds[tour.r];
  (tour.rounds[tour.r + 1] ||= []).push(winner);
  tour.m++;
  if (tour.m * 2 >= ids.length) { tour.r++; tour.m = 0; tour.done = tour.rounds[tour.r].length === 1; }
}
function skipByes() {
  while (!tour.done && isBye(tour.r, tour.m)) {
    const ids = tour.rounds[tour.r];
    advance(ids[tour.m * 2] ?? ids[tour.m * 2 + 1]);
  }
}
const saveTour = () => { try { tour ? localStorage.setItem("sakuga.tournament", JSON.stringify(tour)) : localStorage.removeItem("sakuga.tournament"); } catch {} };
const setup = { source: "season", type: "all", size: 16, pool: null, poolKey: null, error: null, season: null, year: null, pq: "", presults: null };

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function loadPool() {
  if (setup.source === "pick") return;
  const cur = currentSeason();
  const query = setup.source === "search" ? { ...state.query, type: setup.type }
    : { q: "", type: setup.type, season: setup.season || cur.season, year: setup.year || cur.year };
  const key = JSON.stringify(query);
  if (setup.poolKey === key && !setup.error) return; // schon geladen oder unterwegs
  setup.poolKey = key; setup.pool = null; setup.error = null;
  renderTournament();
  try {
    const res = await findThemes(query);
    if (setup.poolKey !== key) return;
    setup.pool = { themes: remember(res.themes).filter(t => t.video), scope: res.scope };
  } catch (e) {
    if (setup.poolKey !== key) return;
    setup.error = e;
  }
  if (route().view === "tournament") renderTournament();
}

      </div>
      ${pickMode ? `<div class="hint" id="sizeHint">${PICKED.length >= 2 ? sizeHint(PICKED.length) : "Füge mindestens 2 Songs hinzu."}</div>` : `<div class="opt"><span class="label">Anzahl Songs</span>
        <div class="sizes">${SIZE_PRESETS.map((n, i) => `<button type="button" class="size rise" style="--i:${i}" data-size="${n}" aria-pressed="${size === n}" ${!loading && avail < n ? "disabled" : ""}><b>${n}</b><small>${n - 1} Duelle</small></button>`).join("")}
          <label class="size custom rise" style="--i:4" aria-pressed="${!SIZE_PRESETS.includes(size)}"><input type="number" id="sizeIn" min="2" max="${loading ? 999 : avail}" value="${size}" aria-label="Eigene Anzahl Songs"><small>Eigene Anzahl${loading ? "" : `, bis ${avail}`}</small></label>
        </div>
        <div class="hint" id="sizeHint">${sizeHint(size)}</div>
      </div>`}
      <div><button type="button" class="btn primary" id="startT" data-size-final="${size}" ${loading || avail < 2 || size > avail ? "disabled" : ""}>Turnier mit ${size} Songs starten</button></div>
    </div></div>`;
    if (pickMode) { renderPicked(); renderPickResults(); }
    loadPool();
    return;
  }
  if (tour.done) return renderChampion();

  const ids = tour.rounds[tour.r];
  const pair = [ids[tour.m * 2], ids[tour.m * 2 + 1]].map(id => tour.themes[id]);
  pair.filter(t => !t.video).forEach(t => upgradeVideo(t).catch(() => {})); // Ersatzvideo schon mal suchen
  ensureCovers(pair);
  const n = ids.length;
  const played = playedDuels(), total = entrantsOf() - 1;
  const fighter = (t, i) => `<div class="fighter rise" style="--i:${i}">
    ${playerHTML(t, true)}${volumeHTML(t)}
    <div><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="tag ${typeCls(t)}">${esc(t.slug)}</span><span class="sub">${esc(animeTitle(t.anime))}</span></div>
      <div class="song">${esc(songTitle(t))}</div><div class="sub">${esc(artistLine(t))}</div></div>
    <button type="button" class="btn primary pick" data-pick="${i}">Weiter mit diesem Song</button>
  </div>`;
  app.innerHTML = `<div class="wrap"><div class="duel">
    <div class="duelhead">
      <div><div class="label">${roundName(n)} · Duell ${tour.m + 1} von ${n / 2}</div><h1 class="big">Wer kommt weiter?</h1></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="num" style="font-size:13px;color:var(--muted)">${played}/${total} Duelle</span>
        <button type="button" class="btn ghost" id="undo" ${played ? "" : "disabled"}>Zurück</button><button type="button" class="btn ghost" id="newT">Abbrechen</button></div>
    </div>
    <div class="pbar"><i style="width:${(played / total) * 100}%"></i></div>
    <div class="vs">${fighter(pair[0], 0)}<div class="vsmark">VS</div>${fighter(pair[1], 1)}</div>
    <div class="keys">Tasten: <kbd>←</kbd> links gewinnt · <kbd>→</kbd> rechts gewinnt · <kbd>Z</kbd> zurück</div>
    ${bracketHTML()}
  </div></div>`;
}

/* ---------- Eigene Auswahl: Songs per Suche zusammenstellen ---------- */

const isPicked = id => PICKED.some(t => t.id === id);

function pickRow(t, on) {
  return `<div class="prow ${on ? "on" : ""}" data-pid="${esc(t.id)}">${cover(t.anime)}
    <div style="min-width:0"><div class="song">${esc(songTitle(t))} <span class="tag ${typeCls(t)}">${esc(t.slug)}</span></div>
      <div class="sub">${esc(artistLine(t))} · ${esc(animeTitle(t.anime))}${t.anime.year ? ` · ${esc(seasonLabel(t.anime))}` : ""}${t.video ? "" : " · noch kein Video"}</div></div>
    <button type="button" class="tog" data-ptoggle="${esc(t.id)}" aria-label="${on ? "Entfernen" : "Hinzufügen"}">${on ? "✓" : "+"}</button></div>`;
}

function renderPicked() {
  const box = $("#tpicked"); if (!box) return;
  box.innerHTML = PICKED.length ? [...PICKED].reverse().map(t => pickRow(t, true)).join("") : `<div class="hint">Noch nichts ausgewählt. Such oben nach Songs und füge sie mit + hinzu.</div>`;
  $("#pcount").textContent = PICKED.length;
  $("#pclear").disabled = !PICKED.length;
  const n = PICKED.length, start = $("#startT");
  start.disabled = n < 2; start.dataset.sizeFinal = n; start.textContent = `Turnier mit ${n} Songs starten`;
  $("#sizeHint").textContent = n >= 2 ? sizeHint(n) : "Füge mindestens 2 Songs hinzu.";
  ensureCovers(PICKED);
}

function renderPickResults() {
  const box = $("#tres"); if (!box) return;
  const r = setup.presults;
  if (!setup.pq) { box.innerHTML = ""; return; }
  if (!r) { box.innerHTML = `<div class="hint">Suche…</div>`; return; }
  if (r.error) { box.innerHTML = `<div class="hint">${esc(r.error)}</div>`; return; }
  const list = r.themes.slice(0, 40);
  const open = list.filter(t => !isPicked(t.id)).length;
  box.innerHTML = `<div class="pickhead" style="margin-bottom:8px"><span class="hint">${r.themes.length} Treffer${r.themes.length > 40 ? ", die ersten 40" : ""}</span>${open ? `<button type="button" class="btn ghost" id="paddall">Alle ${open} hinzufügen</button>` : ""}</div>
    <div class="plist">${list.map(t => pickRow(t, isPicked(t.id))).join("")}</div>`;
  ensureCovers(list);
}

let pickTimer, pickCtl;
function runPickSearch() {
  clearTimeout(pickTimer);
  pickCtl?.abort();
  setup.presults = null;
  renderPickResults();
  if (!setup.pq) return;
  pickTimer = setTimeout(async () => {
    const ctl = pickCtl = new AbortController();
    try {
      const res = await findThemes({ q: setup.pq, type: setup.type, season: "all", year: null }, ctl.signal);
      if (ctl.signal.aborted) return;
      setup.presults = { themes: remember(res.themes) };
    } catch (e) {
      if (e.name === "AbortError") return;
      setup.presults = { themes: [], error: e instanceof Unreachable ? "AnisongDB und AnimeThemes sind nicht erreichbar." : e.message };
    }
    renderPickResults();
  }, 350);
}

function togglePick(id) {
  if (isPicked(id)) PICKED = PICKED.filter(t => t.id !== id);
  else { const t = byId.get(id) || setup.presults?.themes.find(x => x.id === id); if (t) PICKED.push(t); }
  savePicked();
  document.querySelectorAll(`#tres .prow[data-pid="${CSS.escape(id)}"]`).forEach(el => el.outerHTML = pickRow(byId.get(id) || PICKED.find(t => t.id === id), isPicked(id)));
  renderPicked();
  const all = $("#paddall"); if (all) renderPickResults();
}

function sizeHint(n) {
  const slots = 2 ** Math.ceil(Math.log2(Math.max(2, n)));
  return `${n - 1} Duelle${slots > n ? ` · ${slots - n} ${slots - n === 1 ? "Song bekommt" : "Songs bekommen"} in der ersten Runde ein Freilos` : ""}`;
}

function startTournament(count) {
  if (setup.source === "pick") setup.pool = { themes: PICKED.map(t => byId.get(t.id) || t), scope: "Eigene Auswahl" };
  const entrants = shuffle(setup.pool.themes).slice(0, count);
  count = entrants.length;
  const size = 2 ** Math.ceil(Math.log2(Math.max(2, count)));
  const byes = size - count, pairs = size / 2;
  // Freilose gleichmäßig über das Feld verteilen, nie zwei in einem Duell.
  const byePairs = new Set(Array.from({ length: byes }, (_, i) => Math.floor(i * pairs / byes)));
  const slots = [];
  let k = 0;
  for (let m = 0; m < pairs; m++) slots.push(entrants[k++].id, byePairs.has(m) ? null : entrants[k++].id);
  tour = { size, count, scope: setup.pool.scope, themes: Object.fromEntries(entrants.map(t => [t.id, t])), rounds: [slots], r: 0, m: 0, done: false };
  skipByes();
  saveTour(); renderTournament();
}

function pick(i) {
  if (!tour || tour.done || picking) return;
  picking = true;
  document.querySelectorAll("video").forEach(v => v.pause());
  document.querySelectorAll(".fighter").forEach((f, k) => f.classList.add(k === i ? "win" : "lose"));
  setTimeout(() => {
    picking = false;
    advance(tour.rounds[tour.r][tour.m * 2 + i]);
    skipByes();
    saveTour(); renderTournament();
    if (tour.done) burst();
  }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 320);
}

function undo() {
  if (!tour || !playedDuels()) return;
  // Ein echtes Duell zurücknehmen; dabei durchgewunkene Freilose mit zurückdrehen.
  do {
    if (tour.done || tour.m === 0) { tour.r--; tour.m = tour.rounds[tour.r].length / 2; }
    tour.done = false;
    tour.m--;
    tour.rounds[tour.r + 1].pop();
    if (!tour.rounds[tour.r + 1].length) tour.rounds.splice(tour.r + 1);
  } while (isBye(tour.r, tour.m));
  saveTour(); renderTournament();
}

function bracketHTML() {
  const total = Math.log2(tour.size);
  let cols = "";
  for (let r = 0; r < total; r++) {
    const n = tour.size / 2 ** r, ids = tour.rounds[r] || [], next = tour.rounds[r + 1] || [];
    let matches = "";
    for (let m = 0; m < n / 2; m++) {
      const w = next[m];
      const slot = id => {
        if (id === undefined) return `<div class="bslot tbd">offen</div>`;
        if (id === null) return `<div class="bslot tbd">Freilos</div>`;
        const name = esc(songTitle(tour.themes[id]));
        return `<div class="bslot ${w === undefined ? "" : w === id ? "w" : "l"}" title="${name}">${name}</div>`;
      };
      matches += `<div class="bmatch ${!tour.done && r === tour.r && m === tour.m ? "now" : ""}">${slot(ids[m * 2])}${slot(ids[m * 2 + 1])}</div>`;
    }
    cols += `<div class="bround"><h3 class="label">${roundName(n)}</h3><div class="bcol">${matches}</div></div>`;
  }
  const champ = tour.done ? tour.themes[tour.rounds[total][0]] : null;
  cols += `<div class="bround"><h3 class="label">Sieger</h3><div class="bcol"><div class="bmatch ${champ ? "champ" : ""}"><div class="bslot ${champ ? "w" : "tbd"}">${champ ? esc(songTitle(champ)) : "offen"}</div></div></div></div>`;
  return `<div class="bracketwrap"><div class="bracket">${cols}</div></div>`;
}

function resultText() {
  const total = Math.log2(tour.size);
  const line = id => { const t = tour.themes[id]; return `${songTitle(t)} (${animeTitle(t.anime)} ${t.slug}) – ${artistLine(t)}`; };
  const champ = tour.rounds[total][0], final = tour.rounds[total - 1];
  const semis = (tour.rounds[total - 2] || []).filter(id => id !== null && !final.includes(id));
  return [`🏆 Anime-Song-Turnier (${entrantsOf()} Songs)`, "", `1. ${line(champ)}`, `2. ${line(final.find(id => id !== champ))}`, ...semis.map(id => `3. ${line(id)}`)].join("\n");
}

function renderChampion() {
  const t = tour.themes[tour.rounds[Math.log2(tour.size)][0]];
  $("#app").innerHTML = `<div class="wrap"><div class="champ">
    <div class="champcard rise"><div>${playerHTML(t, true)}${volumeHTML(t)}</div>
      <div style="display:grid;gap:8px;min-width:0">
        <div class="label">Sieger · ${entrantsOf()} Songs</div>
        <div class="song">${esc(songTitle(t))}</div>
        <div style="color:var(--muted)">${esc(artistLine(t))} · ${esc(animeTitle(t.anime))} ${esc(t.slug)}</div>
        <div class="actions"><button type="button" class="btn primary" id="copyRes">Ergebnis kopieren</button><button type="button" class="btn" id="undo">Letztes Duell zurück</button><button type="button" class="btn ghost" id="newT">Neues Turnier</button></div>
      </div>
    </div>
    <textarea class="copy" id="resText" readonly aria-label="Ergebnis als Text">${esc(resultText())}</textarea>
    ${bracketHTML()}
  </div></div>`;
}

function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b = document.createElement("div"); b.className = "burst";
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 260, p = document.createElement("i");
    p.style.setProperty("--x", Math.cos(a) * d + "px"); p.style.setProperty("--y", Math.sin(a) * d + 140 + "px");
    p.style.animationDelay = Math.random() * 120 + "ms"; b.appendChild(p);
  }
  document.body.appendChild(b); setTimeout(() => b.remove(), 2000);
}

/* ---------- Einstellungen ---------- */

const mb = n => (n / 1048576).toLocaleString("de-DE", { maximumFractionDigits: n < 10485760 ? 1 : 0 }) + " MB";

function download(name, data) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function exportSongs() {
  download(`sakuga-eigene-songs-${new Date().toISOString().slice(0, 10)}.json`, { app: "sakuga", kind: "songs", version: 1, custom: CUSTOM, replaced: REPLACED });
  toast(`${CUSTOM.length} eigene Songs gesichert`);
}

async function importSongs(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch { return toast("Die Datei ist kein gültiges JSON"); }
  if (d?.app !== "sakuga" || !Array.isArray(d.custom)) return toast("Das ist keine Sakuga-Sicherung eigener Songs");
  let n = 0;
  for (const c of d.custom) {
    if (!c?.id || !c.anime || !c.title) continue;
    const i = CUSTOM.findIndex(x => x.id === c.id);
    if (i >= 0) CUSTOM[i] = c; else CUSTOM.push(c);
    n++;
  }
  saveCustom();
  if (d.replaced && typeof d.replaced === "object") { Object.assign(REPLACED, d.replaced); store.set("sakuga.replaced", REPLACED); }
  toast(`${n} eigene Songs übernommen`);
  renderSettings();
}

function clearApiCache() {
  let n = 0;
  try { Object.keys(localStorage).filter(k => k.startsWith("sakuga.c:") || k.startsWith("sakuga.f:")).forEach(k => { localStorage.removeItem(k); n++; }); } catch {}
  memory.clear();
  byId.clear();
  toast("Zwischenspeicher geleert, Daten werden neu geladen");
}

const srow = (label, hint, controls) => `<div class="srow"><div class="sl"><b>${label}</b>${hint ? `<small>${hint}</small>` : ""}</div><div class="sc">${controls}</div></div>`;
const pchip = (key, value, text) => `<button type="button" class="chip" data-pref="${key}" data-v="${value}" aria-pressed="${String(prefs[key]) === String(value)}">${text}</button>`;

      ${srow("Suchergebnisse", "Standardansicht für Suche und Season-Listen.", pchip("layout", "list", "Liste") + pchip("layout", "grid", "Kacheln"))}
      ${srow("Fallende Blüten", "Die Blätter im Hintergrund.", pchip("petals", "true", "An") + pchip("petals", "false", "Aus"))}

      ${srow(`Eigene Lautstärken<span class="count">${vols}</span>`, "Für jeden Song, bei dem du den Regler verschoben hast, merkt sich Sakuga die Lautstärke.", `<button type="button" class="btn ghost danger" data-act="volReset" ${vols ? "" : "disabled"}>Alle auf 50 % zurücksetzen</button>`)}

    </section>

      ${srow(`Belegt<span class="count" id="usage">…</span>`, "Hochgeladene Videos, eigene Cover und zwischengespeicherte Daten. Damit der Browser nichts davon von selbst löscht, fragt Sakuga beim ersten Upload nach dauerhaftem Speicher.", "")}
      ${srow("Zwischenspeicher leeren", "Sakuga merkt sich Antworten von AnisongDB und AniList für 6 Stunden. Leeren, wenn neue Songs schneller auftauchen sollen. Eigene Songs, Cover und Videos bleiben.", `<button type="button" class="btn ghost" data-act="cacheClear">Leeren</button>`)}

document.addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (!f) return;
  if (e.target.id === "coverImport") { e.target.value = ""; importCovers(f); }
  else if (e.target.id === "songImport") { e.target.value = ""; importSongs(f); }
});

document.addEventListener("click", async e => {
  if (route().view !== "settings") return;
  const p = e.target.closest("[data-pref]");
  if (p) {
    const k = p.dataset.pref, v = p.dataset.v;
    prefs[k] = v === "true" ? true : v === "false" ? false : v;
    savePrefs();
    document.body.classList.toggle("calm", !prefs.petals);
    document.querySelectorAll(`[data-pref="${k}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    if (k === "animeLang") $("#lang").innerHTML = `<span class="${prefs.animeLang === "romaji" ? "on" : ""}">RO</span> / <span class="${prefs.animeLang === "en" ? "on" : ""}">EN</span>`;
    return;
  }
  const a = e.target.closest("[data-act]");
  if (!a || a.disabled) return;
  const act = a.dataset.act;
  // Löschen braucht einen zweiten Klick.
  if (a.classList.contains("danger") && !a.classList.contains("sure")) { a.classList.add("sure"); a.dataset.label = a.textContent; a.textContent = "Wirklich?"; setTimeout(() => { if (a.isConnected) { a.classList.remove("sure"); a.textContent = a.dataset.label; } }, 3500); return; }
  if (act === "coverExport") exportCovers();
  else if (act === "songExport") exportSongs();
  else if (act === "cacheClear") clearApiCache();
  else if (act === "volReset") { for (const k of Object.keys(VOLUMES)) delete VOLUMES[k]; store.set("sakuga.vol", VOLUMES); toast("Lautstärken zurückgesetzt"); renderSettings(); }
  else if (act === "coverClear") { for (const k of Object.keys(COVERS).filter(k => k.startsWith("ani"))) await saveCover(k, null); toast("Eigene Cover entfernt"); renderSettings(); }
});

/* ---------- Startseite ---------- */

// Zuletzt angesehene Songs, die neuesten zuerst.
let RECENT = store.get("sakuga.recent", []);
function rememberRecent(t) {
  RECENT = [t, ...RECENT.filter(x => x.id !== t.id)].slice(0, 12);
  store.set("sakuga.recent", RECENT);
}

const dayKey = () => new Date().toISOString().slice(0, 10);
const dayHash = str => { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const home = { data: null, loading: null, extra: 0 };

async function loadHome() {
  if (home.data || home.loading) return home.loading;
  const cur = currentSeason();
  home.loading = (async () => {
    const [now, last] = await Promise.all([cur.year, cur.year - 1].map(y => findThemes({ q: "", type: "all", season: "all", year: y }).then(r => remember(r.themes)).catch(() => [])));
    const songs = [...now, ...last].filter(t => t.video && t.src !== "custom" && t.type !== "IN");
    home.data = { season: now.filter(t => t.anime.season === cur.season), pool: [...new Map(songs.map(t => [t.id, t])).values()].sort((a, b) => String(a.id).localeCompare(String(b.id))) };
  })();
  await home.loading;
  home.loading = null;
}

function songOfDay() {
  const pool = home.data?.pool || [];
  if (!pool.length) return null;
  return pool[(dayHash(dayKey()) + home.extra * 7919) % pool.length];
}

const quickTile = (href, icon, title, text, i, id = "") => `<a class="qt rise" style="--i:${i}" href="${href}"${id ? ` id="${id}"` : ""}><span class="ic">${icon}</span><b>${title}</b><small>${text}</small></a>`;
const ICON = {
  search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
  cup: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>`,
  plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  gear: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`,
};

function tourStatus() {
  if (!tour) return "Songs paarweise gegeneinander antreten lassen, bis einer gewinnt.";
  if (tour.done) { const w = tour.themes[tour.rounds[Math.log2(tour.size)][0]]; return `Letzter Sieger: ${songTitle(w)}`; }
  return `Läuft gerade: ${roundName(tour.rounds[tour.r].length)}, ${playedDuels()} von ${entrantsOf() - 1} Duellen. Weiter geht's!`;
}

function renderHome() {
  const cur = currentSeason();
  $("#app").innerHTML = `<div class="wrap home">
    <section class="hero">
      <svg class="bigbloom rise" viewBox="-12 -12 24 24" aria-hidden="true"><g fill="currentColor"><use href="#pt"/><use href="#pt" transform="rotate(72)"/><use href="#pt" transform="rotate(144)"/><use href="#pt" transform="rotate(216)"/><use href="#pt" transform="rotate(288)"/></g><circle r="1.8" fill="#ff5a8c"/></svg>
      <h1 class="rise" style="--i:1">Sakuga<small>作画</small></h1>
      <p class="rise" style="--i:2">Anime-Openings und -Endings finden, anhören und im Turnier gegeneinander antreten lassen.</p>
      <label class="searchbox rise" style="--i:3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="hq" type="search" autocomplete="off" placeholder="Anime, Song oder Artist suchen…" aria-label="Suche"></label>
    </section>

    <section class="quick">
      ${quickTile("#suche", ICON.search, "Songs entdecken", `Alle Openings und Endings aus ${cur.year}, filterbar nach Season, Jahr und Typ.`, 4)}
      ${quickTile("#turnier", ICON.cup, tour && !tour.done ? "Turnier fortsetzen" : "Turnier starten", esc(tourStatus()), 5)}
      ${quickTile("#neu", ICON.plus, "Song eintragen", CUSTOM.length ? `${CUSTOM.length} eigene ${CUSTOM.length === 1 ? "Song" : "Songs"} eingetragen. Fehlt noch einer?` : "Neue Songs, die AnisongDB noch nicht kennt, selbst hinzufügen.", 6)}
      ${quickTile("#einstellungen", ICON.gear, "Einstellungen", "Cover importieren, Videoquelle, Darstellung und Sicherungen.", 7)}
    </section>

    <section class="hsec rise" style="--i:8"><div class="head"><h2>Song des Tages</h2><button type="button" id="sotdNext">Anderen Vorschlag</button></div>
      <div id="sotd"><div class="skel"></div></div></section>

    <section class="hsec rise" style="--i:9"><div class="head"><h2>Neu in ${SEASON_DE[cur.season]} ${cur.year}</h2><button type="button" id="seeSeason">Alle anzeigen</button></div>
      <div id="hseason"><div class="skel"></div></div></section>

    ${RECENT.length ? `<section class="hsec rise" style="--i:10"><div class="head"><h2>Zuletzt angesehen</h2><button type="button" id="clearRecent">Verlauf leeren</button></div>
      <div class="hgrid">${RECENT.slice(0, 6).map((t, i) => cardHTML(t, i)).join("")}</div></section>` : ""}
  </div>`;
  ensureCovers(RECENT.slice(0, 6));
  if (home.data) fillHome(); else loadHome().then(() => { if (route().view === "home") fillHome(); });
}

function fillHome() {
  const t = songOfDay(), box = $("#sotd");
  if (box) box.innerHTML = !t ? `<div class="message">Gerade lassen sich keine Songs laden.</div>` : `<div class="sotd"${t.anime.color ? ` style="--glow:${esc(t.anime.color)}"` : ""}>
    <div>${playerHTML(t)}${volumeHTML(t)}</div>
    <div style="min-width:0"><div class="label">${home.extra ? "Vorschlag" : "Heute"} · <span class="tag ${typeCls(t)}">${esc(t.slug)}</span></div>
      <div class="song">${esc(songTitle(t))}</div>
      <div class="sub">${esc(artistLine(t))}</div>
      <div class="sub">${esc(animeTitle(t.anime))} · ${esc(seasonLabel(t.anime))}</div>
      <div class="actions"><a class="btn primary" href="#song-${esc(t.id)}">Zum Song</a></div></div></div>`;
  const season = home.data?.season || [];
  const pick = shuffle(season.filter(x => x.video)).slice(0, 6);
  const sbox = $("#hseason");
  if (sbox) sbox.innerHTML = pick.length ? `<div class="hgrid">${pick.map((x, i) => cardHTML(x, i)).join("")}</div>` : `<div class="hint">Für die laufende Season sind noch keine Songs da. Fehlt dir einer, kannst du ihn <a href="#neu">selbst eintragen</a>.</div>`;
  ensureCovers([...(t ? [t] : []), ...pick]);
}

document.addEventListener("click", e => {
  if (route().view !== "home") return;
  const id = e.target.closest("button")?.id;
  if (id === "sotdNext") { home.extra++; fillHome(); }
  else if (id === "seeSeason") { const cur = currentSeason(); Object.assign(state.query, { q: "", season: cur.season, year: cur.year }); $("#q").value = ""; location.hash = "suche"; runSearch(); }
  else if (id === "clearRecent") { RECENT = []; store.set("sakuga.recent", RECENT); renderHome(); }
});

let homeTimer;
document.addEventListener("input", e => {
  if (e.target.id !== "hq") return;
  clearTimeout(homeTimer);
  homeTimer = setTimeout(() => {
    const v = e.target.value.trim();
    if (!v) return;
    $("#q").value = v;
    state.query.q = v; state.sort = "rel";
    location.hash = "suche";
    runSearch();
    $("#q").focus();
  }, 450);
});

/* ---------- Navigation über #-Adressen (Zurück-Taste funktioniert) ---------- */

function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^song-([tc]?\d+)$/);
  if (m) return { view: "song", id: m[1] };
  const e = h.match(/^bearbeiten-(c\d+)$/);
  if (e) return { view: "edit", id: e[1] };
  if (h === "neu") return { view: "new" };
  if (h === "turnier") return { view: "tournament" };
  if (h === "einstellungen") return { view: "settings" };
  if (h === "suche") return { view: "search" };
  return { view: "home" };
}

function render() {
  const r = route();
  const tab = r.view === "song" ? "search" : r.view === "edit" ? "new" : r.view;
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  $("#lang").innerHTML = `<span class="${prefs.animeLang === "romaji" ? "on" : ""}">RO</span> / <span class="${prefs.animeLang === "en" ? "on" : ""}">EN</span>`;
  if (r.view === "song") renderSong(r.id);
  else if (r.view === "tournament") renderTournament();
  else if (r.view === "new" || r.view === "edit") renderForm(r.id);
  else if (r.view === "settings") renderSettings();
  else if (r.view === "home") renderHome();
  else renderSearch();
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

/* ---------- Eingaben ---------- */

let typingTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    state.query.q = e.target.value.trim();
    state.sort = "rel";
    if (route().view !== "search") location.hash = "suche";
    runSearch();
  }, 300);
});

$("#lang").addEventListener("click", () => { prefs.animeLang = prefs.animeLang === "romaji" ? "en" : "romaji"; savePrefs(); render(); });

$("#app").addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (d.f) { state.query[d.f] = d.v; return runSearch(); }
  if (d.layout) { prefs.layout = d.layout; savePrefs(); return renderSearch(); }
  if (d.src) { setup.source = d.src; return renderTournament(); }
  if (d.ttype) {
    setup.type = d.ttype;
    if (setup.source === "pick") { document.querySelectorAll("[data-ttype]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ttype === d.ttype))); return runPickSearch(); }
    return renderTournament();
  }
  if (d.ptoggle) return togglePick(d.ptoggle);
  if (d.size) { setup.size = +d.size; return renderTournament(); }
  if (d.pick) return pick(+d.pick);
  switch (el.id) {
    case "toT": setup.source = "search"; setup.type = state.query.type; location.hash = "turnier"; return;
    case "startT": return startTournament(+d.sizeFinal);
    case "undo": return undo();
    case "newT": tour = null; saveTour(); return renderTournament();
    case "paddall": (setup.presults?.themes || []).slice(0, 40).forEach(t => { if (!isPicked(t.id)) PICKED.push(t); }); savePicked(); renderPickResults(); return renderPicked();
    case "pclear":
      if (!el.classList.contains("sure")) { el.classList.add("sure"); el.textContent = "Wirklich leeren?"; return; }
      PICKED = []; savePicked(); renderPickResults(); return renderPicked();
    case "copyRes": return copy(resultText(), $("#resText"));
    case "showMore": state.shown += PAGE; return renderSearch(false);
  }
});

$("#app").addEventListener("input", e => {
  if (e.target.id === "tq") { setup.pq = e.target.value.trim(); return runPickSearch(); }
  if (e.target.id !== "sizeIn") return;
  const avail = setup.pool?.themes.length ?? 999;
  const n = Math.round(+e.target.value);
  const ok = n >= 2 && n <= avail;
  if (ok) setup.size = n;
  document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", String(ok && +b.dataset.size === n)));
  e.target.closest(".custom").setAttribute("aria-pressed", String(ok && !SIZE_PRESETS.includes(n)));
  $("#sizeHint").textContent = ok ? sizeHint(n) : `Bitte eine Zahl von 2 bis ${avail}`;
  const start = $("#startT");
  start.disabled = !ok || !setup.pool; start.dataset.sizeFinal = n; start.textContent = `Turnier mit ${ok ? n : "…"} Songs starten`;
});

$("#app").addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; state.shown = PAGE; renderSearch(); }
  if (e.target.id === "year") { state.query.year = e.target.value ? +e.target.value : null; runSearch(); }
  if (e.target.id === "tSeason") { setup.season = e.target.value; renderTournament(); }
  if (e.target.id === "tYear") { setup.year = +e.target.value; renderTournament(); }
});

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (route().view === "tournament" && tour && !tour.done && !typing) {
    if (e.key === "ArrowLeft") pick(0);
    else if (e.key === "ArrowRight") pick(1);
    else if (e.key.toLowerCase() === "z") undo();
  }
});

/* ---------- Fallende Blätter ---------- */
(() => {
  const box = $("#petals");
  for (let i = 0; i < 9; i++) {
    const p = document.createElement("i"), s = .6 + Math.random() * .8;
    Object.assign(p.style, { left: Math.random() * 100 + "%", width: 10 * s + "px", height: 8 * s + "px", animationDuration: 16 + Math.random() * 14 + "s", animationDelay: -Math.random() * 30 + "s" });
    box.appendChild(p);
  }
  // Blütenmuster im Hintergrund
  const petal = "M0 -1 C -4 -4 -4 -9 -1.5 -11 L 0 -9 L 1.5 -11 C 4 -9 4 -4 0 -1Z";
  const flower = (x, y, sc, rot, op) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})" fill="#ffb7c5" fill-opacity="${op}">${[0, 72, 144, 216, 288].map(r => `<path d="${petal}" transform="rotate(${r})"/>`).join("")}<circle r="1.6" fill="#ff5a8c" fill-opacity="${op * 1.4}"/></g>`;
  const loose = (x, y, rot, op) => `<path d="${petal}" transform="translate(${x} ${y}) rotate(${rot}) scale(.8)" fill="#ffb7c5" fill-opacity="${op}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">${flower(40, 50, 1.3, 10, .055)}${flower(190, 160, .9, 40, .045)}${flower(110, 230, .6, 70, .04)}${loose(200, 40, 30, .05)}${loose(70, 150, 120, .04)}${loose(240, 240, 200, .035)}</svg>`;
  document.body.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
})();

render();
runSearch();
setTimeout(() => checkCustom(), 2500);
if ("indexedDB" in window) loadCovers().then(patchCovers);
else Object.assign(COVERS, store.get("sakuga.covers", {}));
</script>
</body>
</html>
